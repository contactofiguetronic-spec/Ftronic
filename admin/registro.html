<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Cuenta — Figuetronic ERP</title>
    <link rel="stylesheet" href="css/tokens.css?v=20260714">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reg-container { width: 100%; max-width: 480px; }

        .reg-card {
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
            padding: 36px 32px;
            border: 1px solid var(--border-subtle);
        }

        .reg-header { text-align: center; margin-bottom: 28px; }

        .reg-logo {
            width: 64px; height: 64px; border-radius: 14px;
            object-fit: cover; margin: 0 auto 14px; display: block;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .reg-title { font-size: 20px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .reg-subtitle { font-size: 13px; color: var(--text-secondary); }

        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }

        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-primary); margin-bottom: 5px; }
        .form-label .required { color: #DC2626; }

        .input-wrapper { position: relative; }
        .input-wrapper i {
            position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            color: var(--text-secondary); font-size: 14px; pointer-events: none;
        }

        .form-input {
            width: 100%; padding: 10px 12px 10px 38px;
            border: 1.5px solid var(--border-color); border-radius: 8px;
            font-size: 14px; color: var(--text-primary); background: var(--bg-input);
            transition: border-color .2s, box-shadow .2s; outline: none;
        }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        .form-input.error { border-color: #DC2626; }

        .form-input-full {
            width: 100%; padding: 10px 12px;
            border: 1.5px solid var(--border-color); border-radius: 8px;
            font-size: 14px; color: var(--text-primary); background: var(--bg-input);
            transition: border-color .2s, box-shadow .2s; outline: none;
        }
        .form-input-full:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }

        textarea.form-input-full { resize: vertical; min-height: 60px; font-family: inherit; }

        .toggle-password {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; padding: 4px; font-size: 14px;
        }
        .toggle-password:hover { color: var(--text-primary); }

        .msg-box {
            display: none; border-radius: 8px; padding: 10px 14px;
            margin-bottom: 14px; font-size: 13px; line-height: 1.4;
        }
        .msg-box.error { background: #FEF2F2; border: 1px solid #FECACA; color: #B91C1C; }
        .msg-box.success { background: #F0FDF4; border: 1px solid #BBF7D0; color: #166534; }
        .msg-box.visible { display: flex; align-items: flex-start; gap: 8px; }

        .btn-submit {
            width: 100%; padding: 12px 20px;
            background: var(--primary); color: #fff; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background .2s, transform .1s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: .6; cursor: not-allowed; }

        .btn-submit .spinner {
            display: none; width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,.3); border-top-color: #fff;
            border-radius: 50%; animation: spin .6s linear infinite;
        }
        .btn-submit.loading .spinner { display: block; }
        .btn-submit.loading .btn-text { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        .reg-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-tertiary); }

        .login-link { text-align: center; margin-top: 16px; font-size: 13px; }
        .login-link a { color: var(--primary); text-decoration: none; font-weight: 500; }
        .login-link a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .reg-card { padding: 24px 18px; }
            .form-row { flex-direction: column; gap: 0; }
        }
        /* Accessibility */
        *:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .form-input:focus-visible, .form-input-full:focus-visible {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(75, 123, 236, 0.15);
        }
    </style>
</head>
<body>
    <div class="reg-container">
        <div class="reg-card">
            <div class="reg-header">
                <img src="https://figuetronic.cl/LOGO1.jpeg" alt="Figuetronic" class="reg-logo">
                <h1 class="reg-title">Solicitar Cuenta</h1>
                <p class="reg-subtitle">Complete el formulario para solicitar acceso al sistema</p>
            </div>

            <div class="msg-box error" id="msgError">
                <i class="fas fa-exclamation-circle"></i>
                <span id="msgErrorText"></span>
            </div>
            <div class="msg-box success" id="msgSuccess">
                <i class="fas fa-check-circle"></i>
                <span id="msgSuccessText"></span>
            </div>

            <form id="regForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="nombre">Nombre <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Juan" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="apellido">Apellido <span class="required">*</span></label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="apellido" name="apellido" class="form-input" placeholder="Pérez" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" class="form-input" placeholder="correo@empresa.cl" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="regPassword">Contraseña <span class="required">*</span></label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="regPassword" name="password" class="form-input" placeholder="Mínimo 6 caracteres" minlength="6" required>
                        <button type="button" class="toggle-password" id="togglePassword" title="Mostrar contraseña">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="telefono">Teléfono</label>
                        <div class="input-wrapper">
                            <i class="fas fa-phone"></i>
                            <input type="tel" id="telefono" name="telefono" class="form-input" placeholder="+569 1234 5678">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="rut">RUT</label>
                        <div class="input-wrapper">
                            <i class="fas fa-id-card"></i>
                            <input type="text" id="rut" name="rut" class="form-input" placeholder="12.345.678-9">
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="empresa">Empresa / Organización</label>
                    <div class="input-wrapper">
                        <i class="fas fa-building"></i>
                        <input type="text" id="empresa" name="empresa" class="form-input" placeholder="Nombre de la empresa">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="motivo">Motivo de la solicitud</label>
                    <textarea id="motivo" name="motivo" class="form-input-full" placeholder="Describa brevemente por qué necesita acceso al sistema..."></textarea>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    <div class="spinner"></div>
                    <span class="btn-text"><i class="fas fa-paper-plane"></i> Enviar Solicitud</span>
                </button>
            </form>

            <div class="login-link">
                <a href="login.html"><i class="fas fa-arrow-left"></i> Volver al inicio de sesión</a>
            </div>
        </div>

        <div class="reg-footer">
            © 2026 Figuetronic SpA — Laboratory Engineering
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        const API = '/admin/api/auth_api.php';
        const form = document.getElementById('regForm');
        const msgError = document.getElementById('msgError');
        const msgErrorText = document.getElementById('msgErrorText');
        const msgSuccess = document.getElementById('msgSuccess');
        const msgSuccessText = document.getElementById('msgSuccessText');
        const btnSubmit = document.getElementById('btnSubmit');

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const input = document.getElementById('regPassword');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // Format RUT on blur
        document.getElementById('rut').addEventListener('blur', function() {
            let v = this.value.replace(/[^0-9kK]/g, '');
            if (v.length > 1) {
                let num = v.slice(0, -1);
                let dv = v.slice(-1).toUpperCase();
                let formatted = num.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '-' + dv;
                this.value = formatted;
            }
        });

        // Submit registration
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            showMsg('');
            setLoading(true);

            const formData = {
                nombre: document.getElementById('nombre').value.trim(),
                apellido: document.getElementById('apellido').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('regPassword').value,
                telefono: document.getElementById('telefono').value.trim(),
                rut: document.getElementById('rut').value.trim(),
                empresa: document.getElementById('empresa').value.trim(),
                motivo: document.getElementById('motivo').value.trim()
            };

            try {
                const res = await fetch(API + '?action=solicitar_registro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await res.json();

                if (data.status === 'success') {
                    showMsg('success', data.message || 'Solicitud enviada correctamente.');
                    form.reset();
                    // Re-enable form after 5 seconds to allow another submission
                    setTimeout(() => {
                        form.querySelectorAll('input, textarea, button').forEach(el => el.disabled = false);
                        setLoading(false);
                    }, 5000);
                } else {
                    showMsg('error', data.message || 'Error al enviar la solicitud.');
                    setLoading(false);
                }
            } catch (err) {
                showMsg('error', 'Error de conexión. Verifique su acceso a internet.');
                setLoading(false);
            }
        });

        function showMsg(type, msg) {
            msgError.classList.remove('visible');
            msgSuccess.classList.remove('visible');
            if (type === 'error' && msg) {
                msgErrorText.textContent = msg;
                msgError.classList.add('visible');
            } else if (type === 'success' && msg) {
                msgSuccessText.textContent = msg;
                msgSuccess.classList.add('visible');
            }
        }

        function setLoading(loading) {
            btnSubmit.disabled = loading;
            btnSubmit.classList.toggle('loading', loading);
        }

        // Check if registration is enabled
        fetch(API + '?action=check_registration')
            .then(r => r.json())
            .then(d => {
                if (d.status === 'success' && d.data && !d.data.enabled) {
                    showMsg('error', 'El registro de nuevas cuentas no está habilitado actualmente. Contacte al administrador.');
                    form.querySelectorAll('input, textarea, button[type="submit"]').forEach(el => el.disabled = true);
                }
            })
            .catch(() => {});
    })();
    </script>
</body>
</html>
