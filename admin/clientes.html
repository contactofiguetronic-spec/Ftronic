<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Figuetronic</title>
    <link rel="stylesheet" href="css/index.css?v=20260706050000">
    <link rel="stylesheet" href="css/ficha.css?v=20260706050000">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Module-specific overrides — shared ficha styles in ficha.css */
    </style>
</head>
<body>
        <aside class="sidebar" id="sidebar-mount"></aside>
<script src="js/sidebar-loader.js"></script>
    <main class="main-content">
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <h1 class="page-title"><span class="nav-icon-box icon-people"><i class="fas fa-user-group"></i></span> Clientes</h1>
            </div>
            <div class="header-right">
                <button class="btn btn-sm btn-secondary" id="btnHeaderSearch" title="Buscar (\u2318K)"><i class="fas fa-search"></i> Buscar</button>
                <button class="btn-help" id="btnHelp" title="Ayuda del módulo"><i class="fas fa-question"></i></button>
            </div>
        </header>
        <div class="breadcrumbs"></div>

        <!-- ═══ LIST VIEW ═══ -->
        <div id="listView">
            <div class="data-toolbar">
                <div class="search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar por nombre, RUT o teléfono...">
                </div>
                <div class="toolbar-actions">
                    <button class="btn btn-primary" id="btnNuevo" data-perm="clientes:crear"><i class="fas fa-plus"></i> Nuevo</button>
                </div>
            </div>
            <div class="card-grid" id="cardGrid"></div>
            <div id="paginationContainer"></div>
        </div>

        <!-- ═══ FICHA COMPLETA ═══ -->
        <div class="ficha-container" id="fichaContainer">
            <div class="ficha-header">
                <div class="ficha-avatar" id="fichaAvatar">CL</div>
                <div class="ficha-info">
                    <h2 id="fichaTitle">—</h2>
                    <div class="ficha-sub" id="fichaSub">—</div>
                    <div class="contact-links" id="fichaContacts"></div>
                </div>
                <div class="ficha-actions">
                    <button class="btn btn-secondary" id="btnBackList"><i class="fas fa-arrow-left"></i> Volver</button>
                    <button class="btn btn-danger" id="btnFichaDelete" data-perm="clientes:eliminar"><i class="fas fa-trash"></i></button>
                </div>
            </div>

            <div class="stats-row" id="fichaStats"></div>

            <div class="ficha-tabs" id="fichaTabs">
                <div class="ficha-tab active" data-tab="datos"><i class="fas fa-user"></i> Datos</div>
                <div class="ficha-tab" data-tab="vehiculos"><i class="fas fa-car"></i> Vehículos <span class="tab-badge" id="badgeVeh">0</span></div>
                <div class="ficha-tab" data-tab="recepciones"><span class="nav-icon-box icon-clipboard"><i class="fas fa-clipboard-list"></i></span> Recepciones <span class="tab-badge" id="badgeRecep">0</span></div>
                <div class="ficha-tab" data-tab="presupuestos"><span class="nav-icon-box icon-invoice"><i class="fas fa-file-invoice-dollar"></i></span> Presupuestos <span class="tab-badge" id="badgePres">0</span></div>
                <div class="ficha-tab" data-tab="ots"><span class="nav-icon-box icon-wrench"><i class="fas fa-screwdriver-wrench"></i></span> Órdenes de Trabajo <span class="tab-badge" id="badgeOT">0</span></div>
                <div class="ficha-tab" data-tab="ventas"><span class="nav-icon-box icon-register"><i class="fas fa-cash-register"></i></span> Ventas</div>
            </div>

            <!-- Tab: Datos -->
            <div class="ficha-panel active" id="tabDatos">
                <form id="dataForm" enctype="multipart/form-data">
                    <input type="hidden" name="id" id="record_id">
                    <div class="form-grid">
                        <div class="form-group"><label>Nombre <span class="required-dot">*</span></label><input type="text" id="nombre" name="nombre" placeholder="Juan"></div>
                        <div class="form-group"><label>Apellido <span class="required-dot">*</span></label><input type="text" id="apellido" name="apellido" placeholder="Pérez"></div>
                        <div class="form-group"><label>RUT</label><input type="text" id="rut" name="rut" placeholder="12.345.678-9"></div>
                        <div class="form-group"><label>Teléfono</label><input type="tel" id="telefono" name="telefono" placeholder="+56 9 1234 5678"></div>
                        <div class="form-group"><label>Correo</label><input type="email" id="correo" name="correo" placeholder="cliente@email.com"></div>
                        <div class="form-group"><label>Banco</label><div class="select-wrapper"><select id="banco" name="banco" data-category="bancos"><option value="">—</option></select><button type="button" class="btn-add-option" title="Nuevo"><i class="fas fa-plus"></i> Nuevo</button></div></div>
                        <div class="form-group"><label>Nº Cuenta</label><input type="text" id="cuentabancaria" name="cuentabancaria" placeholder="Número de cuenta"></div>
                        <div class="form-group full-width"><label>Domicilio</label><textarea id="domicilio" name="domicilio" rows="2"></textarea></div>
                        <div class="form-group"><label>Facebook</label><input type="text" id="facebook" name="facebook" placeholder="@usuario"></div>
                        <div class="form-group"><label>Instagram</label><input type="text" id="instagram" name="instagram" placeholder="@usuario"></div>
                        <div class="form-group full-width"><label>Observaciones</label><textarea id="detalles_personales" name="detalles_personales" rows="2"></textarea></div>
                    </div>
                    <div class="actions">
                        <button type="button" class="btn btn-secondary" id="btnReset"><i class="fas fa-times"></i> Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnSave" data-perm="clientes:editar"><i class="fas fa-save"></i> Guardar</button>
                    </div>
                </form>
                <div class="multimedia-area" style="margin-top:1.5rem;">
                    <h3><i class="fas fa-photo-video"></i> Adjuntos del Cliente</h3>
                    <div id="existingMediaContainer" style="display:none;">
                        <p class="media-label">Archivos almacenados:</p>
                        <div class="existing-media-grid" id="existingMediaGrid"></div>
                    </div>
                    <div class="multimedia-toolbar" id="multimediaToolbar"></div>
                    <div class="upload-zone compact" id="uploadZone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>O arrastra archivos aquí</p>
                    </div>
                </div>
            </div>

            <!-- Tab: Vehículos -->
            <div class="ficha-panel" id="tabVehiculos">
                <div id="vehiculosList"></div>
            </div>

            <!-- Tab: Recepciones -->
            <div class="ficha-panel" id="tabRecepciones">
                <div id="recepcionesList"></div>
            </div>

            <!-- Tab: Presupuestos -->
            <div class="ficha-panel" id="tabPresupuestos">
                <div id="presupuestosList"></div>
            </div>

            <!-- Tab: OTs -->
            <div class="ficha-panel" id="tabOts">
                <div id="otsList"></div>
            </div>

            <!-- Tab: Ventas -->
            <div class="ficha-panel" id="tabVentas">
                <div id="ventasList"></div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="imgModal" style="display:none;" onclick="this.style.display='none'">
        <div style="max-width:90vw;max-height:90vh;display:flex;align-items:center;justify-content:center;">
            <img id="imgModalSrc" style="max-width:100%;max-height:90vh;border-radius:var(--radius-md);">
        </div>
    </div>

    

    <nav class="bottom-nav" id="bottomNav">
        <div class="bottom-nav-inner">
            <a href="dashboard.html" class="bottom-nav-item"><span class="nav-icon-box icon-home"><i class="fas fa-house-chimney"></i></span><span>Inicio</span></a>
            <a href="ordenes_trabajo.html" class="bottom-nav-item"><span class="nav-icon-box icon-wrench"><i class="fas fa-screwdriver-wrench"></i></span><span>OTs</span></a>
            <a href="recepcion_unificada.html" class="bottom-nav-item"><span class="nav-icon-box icon-clipboard"><i class="fas fa-clipboard-list"></i></span><span>Recepción</span></a>
<a href="desarme_automotriz.html" class="bottom-nav-item"><span class="nav-icon-box icon-wrench"><i class="fas fa-car-burst"></i></span><span>Desarme</span></a>
            <a href="presupuestos.html" class="bottom-nav-item"><span class="nav-icon-box icon-invoice"><i class="fas fa-file-invoice-dollar"></i></span><span>Presup.</span></a>
            <a href="ingresos.html" class="bottom-nav-item"><span class="nav-icon-box icon-cash"><i class="fas fa-hand-holding-dollar"></i></span><span>Ingresos</span></a>
            <a href="pos.html" class="bottom-nav-item"><span class="nav-icon-box icon-bolt"><i class="fas fa-cart-shopping"></i></span><span>POS</span></a>
            <a href="pagos.html" class="bottom-nav-item"><span class="nav-icon-box icon-card"><i class="fas fa-calendar-check"></i></span><span>Pagos</span></a>
            <button class="bottom-nav-item" id="btnBottomCmd" title="Buscar"><i class="fas fa-search"></i><span>Buscar</span></button>
        </div>
    </nav>

<script src="js/common.js?v=20260714090000"></script>
    <script src="js/clientes.js?v=20260706050000"></script>
<script src="js/command-palette.js?v=20260706050000"></script>
</body>
</html>
