<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresos y Cobros - Figuetronic</title>
    <link rel="stylesheet" href="css/index.css?v=20260710010000">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <aside class="sidebar" id="sidebar-mount"></aside>
<script src="js/sidebar-loader.js"></script>

<main class="main-content">
    <header class="header">
        <div class="header-left">
            <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
            <h1 class="page-title"><span class="nav-icon-box icon-cash"><i class="fas fa-hand-holding-dollar"></i></span> Ingresos y Cobros</h1>
        </div>
        <div class="header-right">
            <button class="btn btn-sm btn-secondary" id="btnHeaderSearch" title="Buscar"><i class="fas fa-search"></i></button>
            <button class="btn-help" id="btnHelp" title="Ayuda"><i class="fas fa-question"></i></button>
        </div>
    </header>
    <div class="breadcrumbs"></div>
    <div class="module-hero green">
        <div class="mh-icon"><i class="fas fa-hand-holding-dollar"></i></div>
        <h2>Ingresos y Cobros</h2>
        <div class="mh-subtitle">Visualizar todos los ingresos del taller: pagos de presupuestos y ventas directas. Filtrar por tipo, fecha o cliente.</div>
    </div>

    <!-- KPIs -->
    <div class="ot-kpi-row" id="kpiRow">
        <div class="ot-kpi-card" id="kpiMesActual"><span class="ot-kpi-val">$0</span><span class="ot-kpi-lbl">Mes actual</span></div>
        <div class="ot-kpi-card" id="kpiMontoTotal"><span class="ot-kpi-val">$0</span><span class="ot-kpi-lbl">Total ingresos</span></div>
        <div class="ot-kpi-card" id="kpiPptos"><span class="ot-kpi-val">$0</span><span class="ot-kpi-lbl">Desde Presupuestos</span></div>
        <div class="ot-kpi-card" id="kpiVentas"><span class="ot-kpi-val">$0</span><span class="ot-kpi-lbl">Desde Ventas</span></div>
    </div>

    <!-- Toolbar -->
    <div class="ot-toolbar">
        <div class="ot-toolbar-left">
            <div class="search-wrap">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por cliente, patente, # documento...">
            </div>
            <div class="module-tabs" id="moduleTabs" style="display:flex;gap:0.25rem;margin-left:1rem;">
                <button class="module-tab active" data-filter=""><i class="fas fa-layer-group"></i> Todos</button>
                <button class="module-tab" data-filter="ppto"><i class="fas fa-file-invoice-dollar"></i> Presupuestos</button>
                <button class="module-tab" data-filter="venta"><i class="fas fa-cart-shopping"></i> Ventas</button>
            </div>
        </div>
        <div class="ot-toolbar-right">
            <label style="font-size:0.78rem;color:var(--text-secondary);margin-right:0.3rem;">Desde:</label>
            <input type="date" id="filterFechaDesde" style="font-size:0.8rem;padding:0.3rem 0.5rem;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);color:var(--text-primary);">
            <label style="font-size:0.78rem;color:var(--text-secondary);margin:0 0.3rem;">Hasta:</label>
            <input type="date" id="filterFechaHasta" style="font-size:0.8rem;padding:0.3rem 0.5rem;border:1px solid var(--border-color);border-radius:6px;background:var(--bg-card);color:var(--text-primary);">
        </div>
    </div>

    <div class="card-grid" id="cardGrid"></div>
    <div id="paginationContainer"></div>
    <div id="emptyState" style="display:none;text-align:center;padding:3rem;color:var(--text-secondary);">
        <i class="fas fa-hand-holding-dollar" style="font-size:3rem;opacity:0.3;display:block;margin-bottom:1rem;"></i>
        <p>No hay ingresos registrados</p>
    </div>
</main>

<!-- Modal Detalle -->
<div class="modal" id="detalleModal">
    <div class="modal-content modal-md">
        <div class="modal-header">
            <h3><i class="fas fa-receipt"></i> Detalle del Ingreso</h3>
            <button class="modal-close" onclick="el('detalleModal').classList.remove('active')">&times;</button>
        </div>
        <div class="modal-body" id="detalleContent"></div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" onclick="el('detalleModal').classList.remove('active')"><i class="fas fa-times"></i> Cerrar</button>
        </div>
    </div>
</div>

    <nav class="bottom-nav" id="bottomNav">
        <div class="bottom-nav-inner">
            <a href="dashboard.html" class="bottom-nav-item"><span class="nav-icon-box icon-home"><i class="fas fa-house-chimney"></i></span><span>Inicio</span></a>
            <a href="ordenes_trabajo.html" class="bottom-nav-item"><span class="nav-icon-box icon-wrench"><i class="fas fa-screwdriver-wrench"></i></span><span>OTs</span></a>
            <a href="ingresos.html" class="bottom-nav-item active"><span class="nav-icon-box icon-cash"><i class="fas fa-hand-holding-dollar"></i></span><span>Ingresos</span></a>
            <a href="pos.html" class="bottom-nav-item"><span class="nav-icon-box icon-bolt"><i class="fas fa-cart-shopping"></i></span><span>POS</span></a>
            <button class="bottom-nav-item" id="btnBottomCmd" title="Buscar"><i class="fas fa-search"></i><span>Buscar</span></button>
        </div>
    </nav>

<script src="js/common.js?v=20260714090000"></script>
<script src="js/ingresos.js?v=20260710010000"></script>
<script src="js/command-palette.js?v=20260710010000"></script>
</body>
</html>
